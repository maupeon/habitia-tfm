name: Verificación del modelo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements_revision.txt
            servicio/requirements.txt
      - run: python -m pip install -r requirements_revision.txt -r servicio/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
      - run: python -m compileall -q src servicio tests scripts
